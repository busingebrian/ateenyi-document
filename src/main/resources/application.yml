spring:
  application:
    name: document
  main:
    banner-mode: off
  datasource:
    url: jdbc:h2:file:./data/document;AUTO_SERVER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS document
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:document}
        format_sql: false
        hbm2ddl:
          create_namespaces: true

document:
  notification:
    send-type: sync
    url: http://${NOTIFICATION_URL:localhost}:8081/api/notification
    email: ${NOTIFICATION_EMAIL:notifications@training.local}

server:
  servlet:
    context-path: /api/document
  port: 8080

logging:
  level:
    root: warn
    com.training.document: ${APP_LOG_LEVEL:info}
