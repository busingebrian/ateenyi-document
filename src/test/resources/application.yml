spring:
  application:
    name: document
  main:
    banner-mode: off
  datasource:
    url: jdbc:h2:mem:document-test;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS document
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

document:
  notification:
    send-type: none

logging:
  level:
    root: warn
    com.training.document: info
