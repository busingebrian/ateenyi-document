variables:
  JAR_FILE: build/libs/document.jar
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"


stages:
 - build
 - test
 - build-docker
 - deploy

build:
  stage: build
  #image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/gradle:jdk17
  image: git.iunetworks.am:5050/ops/iunetworks_java:java25-gradle-deb-jdk
  script: 
      #- chmod +x ./gradlew
      - ./gradlew bootJar --build-cache -Dmaven.repo.local="$MAVEN_USER_HOME/repository"
  retry:
    when: script_failure
    max: 2
  artifacts:
    expire_in: 1 hrs
    paths:
      - $JAR_FILE

test:
  stage: test
  #image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/gradle:jdk17
  image: git.iunetworks.am:5050/ops/iunetworks_java:java25-gradle-deb-jdk
  script: 
      #- chmod +x ./gradlew
      - ./gradlew clean test --build-cache -Dmaven.repo.local="$MAVEN_USER_HOME/repository"
  retry:
    when: script_failure
    max: 2
  rules:
    - if: '$CI_COMMIT_REF_NAME == "uat-zim" || $CI_COMMIT_REF_NAME == "uat-rms" || $CI_COMMIT_REF_NAME == "uat-eri" || $CI_COMMIT_REF_NAME == "prod-zim" || $CI_COMMIT_REF_NAME == "prod-rms" || $CI_COMMIT_REF_NAME == "prod-eri" || $CI_COMMIT_REF_NAME == "prod" || $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$SKIP_PARENT_TEST == "true"'
      when: never
    - when: on_success

docker-build:
  # Use the official docker image.
  stage: build-docker
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  # Default branch leaves tag empty (= latest tag)
  # All other branches are tagged with the escaped branch name (commit ref slug)
  script:
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        tag=""
        echo "Running on default branch '$CI_DEFAULT_BRANCH': tag = 'latest'"
      else
        tag=":$CI_COMMIT_REF_SLUG"
        echo "Running on branch '$CI_COMMIT_BRANCH': tag = $tag"
      fi
    - docker build --build-arg R_VERSION=${RANCHER_VERSION} --pull -t "$CI_REGISTRY_IMAGE${tag}" .
    - docker push "$CI_REGISTRY_IMAGE${tag}"
  # Run this job in a branch where a Dockerfile exists
  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - Dockerfile

deploy-train:
  stage: deploy
  image: alpine:3.20
  variables:
    SVC: document          # service name
    PORTAINER: https://portainer.t.utax.am
  script:
    - apk add -q curl jq
    - |
      ID=$(curl -fsS -H "X-API-Key: $PORTAINER_TOKEN" -G "$PORTAINER/api/endpoints/1/docker/containers/json" \
        --data-urlencode "filters={\"name\":[\"^/ug-train-docker-${SVC}-1$\"]}" | jq -r '.[0].Id')
      [ -n "$ID" ] && [ "$ID" != null ] || { echo "container for $SVC not found"; exit 1; }
      CODE=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST -H "X-API-Key: $PORTAINER_TOKEN" \
        -H "Content-Type: application/json" -d '{"PullImage":true}' "$PORTAINER/api/docker/1/containers/$ID/recreate")
      if [ "$CODE" = 200 ]; then
        jq -r '"deployed \(.Name) image=\(.Config.Image) digest=\(.Image[7:19]) state=\(.State.Status)"' /tmp/r.json
      else
        jq -r '"FAILED HTTP '"$CODE"': \(.message) - \(.details)"' /tmp/r.json; exit 1
      fi