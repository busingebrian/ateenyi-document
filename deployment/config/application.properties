# Externalized overrides for containerized runs (mounted next to the jar).

# --- PostgreSQL (production) ---
spring.datasource.url=${DB_CONNECTION_STRING}/${DB_NAME}?ApplicationName=${DB_APP_NAME:document}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:document}

